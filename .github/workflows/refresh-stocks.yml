name: Refresh Stock Data

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # needed so we can fetch the data branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas lxml html5lib

      - name: Fetch stock data
        run: python scripts/fetch_stocks.py
        # writes stocks-data.json to the working directory

      - name: Commit to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check out the data branch into a separate worktree
          git fetch origin data
          git worktree add /tmp/data-branch data

          # Copy the generated file into the data branch worktree
          cp stocks-data.json /tmp/data-branch/stocks-data.json

          # Commit and push only if the file actually changed
          cd /tmp/data-branch
          git add stocks-data.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: refresh stock data"
          git push origin data
